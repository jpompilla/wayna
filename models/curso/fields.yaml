fields:
    nombre:
        label: Nombre
        span: left
        type: text    
    resumen:
        label: Resumen
        size: ''
        span: right
        type: textarea
    users:
        label: Colaboradores
        nameFrom: fullname
        descriptionFrom: description
        span: left
        type: relation
    contenido:
        label: Contenido
        prompt: 'Añadir Unidad'
        style: default
        span: right
        type: repeater
        form:
            fields:
                unidad:
                    label: Unidad
                    span: full
                    type: text
                actividades:
                    label: Actividades
                    prompt: 'Añadir Actividad'
                    style: default
                    span: full
                    type: repeater
                    form:
                        fields:
                            titulo:
                                label: Titulo
                                span: full
                                type: text
                            video:
                                label: 'Video URL'
                                span: auto
                                type: text
                            duracion:
                                label: 'Duracion (mm:ss)'
                                span: auto
                                type: text
                            resumen:
                                label: Resumen
                                size: ''
                                span: full
                                type: textarea
                            recursos:
                                label: Recursos
                                nameFrom: nombre
                                descriptionFrom: descripcion
                                span: full
                                type: repeater
                                form:
                                    fields:
                                        tipo:
                                            label: Tipo
                                            span: storm
                                            cssClass: col-md-3
                                            type: dropdown
                                            options:
                                                download: Download
                                                link: Link
                                        titulo:
                                            label: Titulo
                                            span: storm
                                            cssClass: col-md-9
                                            type: text
                                        url:
                                            label: URL
                                            span: storm
                                            cssClass: col-md-12
                                            type: text
                                            trigger:
                                                action: show
                                                field: tipo
                                                condition: value[link]
                                        documento:
                                            label: Download
                                            span: storm
                                            cssClass: col-md-12
                                            type: mediafinder
                                            trigger:
                                                action: show
                                                field: tipo
                                                condition: value[download]
